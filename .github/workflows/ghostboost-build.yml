name: Build GhostBoost

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "GhostBoost/**"
      - ".github/workflows/ghostboost-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "GhostBoost/**"
      - ".github/workflows/ghostboost-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build GhostBoost
        run: gradle --no-daemon -p GhostBoost clean build

      - name: Find installable JAR
        id: jar
        shell: bash
        run: |
          JAR="$(find GhostBoost/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No installable JAR was produced."
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBoost-Minecraft-1.21.11
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
